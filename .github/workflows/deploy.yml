name: Deploy to Trigger.dev (prod)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Trigger.dev tasks
        env:
          # Add this in GitHub → repo → Settings → Secrets and variables → Actions.
          # Value: cloud.trigger.dev → Profile → Personal Access Tokens (starts with tr_pat_)
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npx trigger.dev@4.7.4 deploy --env prod
